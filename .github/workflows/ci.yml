name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck
        if: runner.os == 'Linux'
        run: make lint
      # The helper targets the bash 3.2 macOS ships; the runner also has a
      # newer Homebrew bash on PATH, so put the system one first.
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: bash version
        run: |
          bash -c 'echo "bash $BASH_VERSION"; if [ "$RUNNER_OS" = macOS ]; then [ "${BASH_VERSINFO[0]}" -eq 3 ]; fi'
      - name: tests
        run: make test
